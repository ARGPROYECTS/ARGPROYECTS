<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARGProyects - Menú Principal</title>
    <link rel="stylesheet" href="./menu_principal.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="menu-background">
        <div class="overlay"></div>
        
        <div id="title-container">
            <h1 class="title-glow">ARGPROYECTS</h1>
            <h2 class="subtitle">Juegos y Servidores</h2>
            <p class="hero-lead">Accede a nuestros juegos, paneles de servidores y comunidad. Selecciona una opción para comenzar.</p>
            <div class="user-area">
                <span id="user-welcome" class="muted">No has iniciado sesión</span>
                <a id="btn-login-link" class="btn-small" href="login.html">Iniciar</a>
                <a id="btn-admin-link" class="btn-small" href="admin.html" style="display:none">Admin</a>
                <button id="btn-logout-mini" class="btn-small" style="display:none">Salir</button>
            </div>
        </div>
        
        <div id="main-menu">
            <div class="menu-columns">
                <div class="menu-options">
                    <button id="btn-menu-juegos" class="btn-option active">Juegos</button>
                    <button id="btn-menu-servidores" class="btn-option">Servidores</button>
                    <button id="btn-menu-info" class="btn-option">Información</button>
                </div>

                <div class="menu-content">
                    <div id="juegos-panel" class="panel">
                        <div class="button-group">
                            <button id="btn-play-blockzoid" class="btn-main btn-blockzoid">JUGAR BLOCKZOID ONLINE</button>
                            <button id="btn-play-supervivencia" class="btn-main btn-supervivencia">MODO CARTAS SALVA EL MUNDO</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    <script>
        // Información: ir a la página social principal
        document.addEventListener('DOMContentLoaded', ()=>{
            const info = document.getElementById('btn-menu-info');
            if(info) info.addEventListener('click', ()=> location.href='social.html');
        });
    </script>
        
        <footer id="signature">
            Hecho por Alvaro Restrepo
        </footer>
    </div>

    <script src="script.js"></script>
    <script src="./auth.js"></script>
    <script>
        // Diagnóstico: verificar que el CSS se cargó (revisa la consola)
        (function(){
            const found = Array.from(document.styleSheets).some(s => s.href && s.href.includes('menu_principal.css'));
            if(!found) console.warn('Aviso: menu_principal.css no parece cargado. Comprueba rutas o GitHub Pages.');
            else console.log('menu_principal.css cargado correctamente.');
        })();

        // Actualizar UI según estado de autentificación
        (function(){
            function refresh(){
                const cur = apAuth.getCurrent();
                const welcome = document.getElementById('user-welcome');
                const adminLink = document.getElementById('btn-admin-link');
                const loginLink = document.getElementById('btn-login-link');
                const logoutBtn = document.getElementById('btn-logout-mini');
                if(cur){
                    welcome.textContent = cur.username + ' (' + cur.role + ')';
                    loginLink.style.display = 'none';
                    logoutBtn.style.display = 'inline-block';
                    if(cur.role==='admin') adminLink.style.display = 'inline-block'; else adminLink.style.display = 'none';
                } else {
                    welcome.textContent = 'No has iniciado sesión';
                    loginLink.style.display = 'inline-block';
                    adminLink.style.display = 'none';
                    logoutBtn.style.display = 'none';
                }
            }
            refresh();
            const lb = document.getElementById('btn-logout-mini');
            lb.addEventListener('click', ()=>{ apAuth.logout(); refresh(); });
        })();
    </script>
</body>
</html>
