<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARGProyects - Menú Principal</title>
    <link rel="stylesheet" href="./menu_principal.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="menu-background">
        <div class="overlay"></div>
        
        <div id="title-container">
            <h1 class="title-glow">ARGPROYECTS</h1> 
            <h2 class="subtitle">TOXIC GAMES PRODUCTIONS</h2>
        </div>
        
        <div id="main-menu">
            <div class="menu-columns">
                <div class="menu-options">
                    <button id="btn-menu-juegos" class="btn-option active">Juegos</button>
                    <button id="btn-menu-servidores" class="btn-option">Servidores</button>
                </div>

                <div class="menu-content">
                    <div id="juegos-panel" class="panel">
                        <div class="button-group">
                            <button id="btn-play-blockzoid" class="btn-main btn-blockzoid">JUGAR BLOCKZOID ONLINE</button>
                            <button id="btn-play-supervivencia" class="btn-main btn-supervivencia">MODO CARTAS SALVA EL MUNDO</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <footer id="signature">
            Hecho por Alvaro Restrepo
        </footer>
    </div>

    <script src="script.js"></script>
    <script>
        // Diagnóstico: verificar que el CSS se cargó (revisa la consola)
        (function(){
            const found = Array.from(document.styleSheets).some(s => s.href && s.href.includes('menu_principal.css'));
            if(!found) console.warn('Aviso: menu_principal.css no parece cargado. Comprueba rutas o GitHub Pages.');
            else console.log('menu_principal.css cargado correctamente.');
        })();
    </script>
</body>
</html>
