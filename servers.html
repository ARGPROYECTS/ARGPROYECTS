<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servidores - ARGPROYECTS</title>
    <link rel="stylesheet" href="./menu_principal.css">
</head>
<body>
    <div id="menu-background">
        <div class="overlay"></div>

        <header class="servers-hero">
            <div class="hero-left">
                <h1 class="title-glow">SERVIDORES</h1>
                <h2 class="subtitle">Encuentra y únete a nuestras comunidades</h2>
                <p class="hero-lead">Explora servidores con información clara: versión, modpack, discord y estado en tiempo real. Usa los botones para copiar la IP o visitar los enlaces del servidor.</p>
            </div>
        </header>

        <main class="servers-area">
            <div class="servers-controls">
                <div class="servers-info">
                    <h3>Servidores publicados</h3>
                    <p id="servers-count" class="muted">Cargando...</p>
                </div>
                <div class="servers-actions">
                    <button id="servers-refresh" class="btn-small">Actualizar</button>
                </div>
            </div>

            <div id="servers-list" class="server-grid">
                <!-- servidores se renderizan aquí dinámicamente -->
            </div>
        </main>

        <footer id="signature">Hecho por Alvaro Restrepo</footer>
    </div>

    <script src="./auth.js"></script>
    <script src="./firebase-client.js"></script>
    <script>
        // Diagnostics
        console.log('servers.js loaded', { apAuth: typeof apAuth, current: (window.apAuth && apAuth.getCurrent)? apAuth.getCurrent() : null });

        const API_BASE = 'http://localhost:3000';

        // Renderizar lista de servidores y añadir funcionalidad (copiar IP, abrir enlaces, editar para admins)
        (function(){
            try{
            async function fetchServersFromApi(){
                // prefer firebase if available
                try{
                    if(window.StaticDB && StaticDB.getServers){
                        const list = await StaticDB.getServers();
                        if(Array.isArray(list)) return list;
                    }
                }catch(e){ console.warn('StaticDB getServers failed', e); }

                // Only try local API when running on localhost to avoid ERR_CONNECTION_REFUSED
                const host = window.location.hostname;
                if(host !== 'localhost' && host !== '127.0.0.1'){
                    // Skip local API when hosted (GitHub Pages or other domain)
                    return null;
                }

                try{
                    const r = await fetch(API_BASE + '/servers');
                    if(!r.ok) throw new Error('bad');
                    const data = await r.json();
                    if(Array.isArray(data)){
                        // persist locally as backup
                        if(window.apAuth && apAuth.saveServers) apAuth.saveServers(data);
                        return data;
                    }
                }catch(e){ console.warn('API servers fetch failed', e); }
                return null;
            }

            async function loadServers(){
                const remote = await fetchServersFromApi();
                let list = remote || ((window.apAuth && apAuth.getServers) ? apAuth.getServers() : []);
                renderList(list);
            }

            function makeCard(s){
                const card = document.createElement('section');
                card.className = 'server-card feature';
                card.innerHTML = `
                    <div class="card-left">
                        <h3 class="server-name">${escapeHtml(s.name || 'Servidor')}</h3>
                        <p class="server-desc">${escapeHtml(s.desc || '')}</p>
                        <div class="server-meta">
                            <div class="status"><span class="status-dot ${s.online? 'online':''}"></span><strong>${s.online? 'En línea':'Desconocido'}</strong></div>
                            <div class="players"><strong>${s.players||0}</strong><span> jugadores conectados</span></div>
                        </div>
                    </div>
                    <div class="card-right">
                        <div class="ip-box">
                            <div class="ip-label">Dirección</div>
                            <div class="ip-value"><code class="server-ip">${escapeHtml(s.ip || '')}</code></div>
                            <button class="btn-small btn-copy-ip">Copiar</button>
                        </div>
                        <ul class="server-links">
                            <li><strong>Versión:</strong> ${escapeHtml(s.version || '')}</li>
                            ${s.modpack? `<li><strong>Modpack:</strong> <a href="${escapeAttr(s.modpack)}" target="_blank" rel="noopener">Descargar</a></li>` : ''}
                            ${s.discord? `<li><strong>Discord:</strong> <a href="${escapeAttr(s.discord)}" target="_blank" rel="noopener">Únete</a></li>` : ''}
                        </ul>
                        <div class="server-actions">
                                <button class="btn-main alt btn-copy-ip-2">Copiar IP</button>
                        </div>
                    </div>`;
                return card;
            }

            function escapeHtml(str){ return (str+'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
            function escapeAttr(s){ return (s||'').replace(/"/g,'"'); }

            const container = document.getElementById('servers-list');
            // render helper
            function renderList(list){
                console.log('rendering servers list, count=', list.length);
                const countEl = document.getElementById('servers-count'); if(countEl) countEl.textContent = list.length + ' servidores';
                if(!list || list.length===0){ container.innerHTML = '<p class="muted">No hay servidores publicados todavía.</p>'; return; }
                container.innerHTML = '';
                list.forEach(s=> container.appendChild(makeCard(s)));

                // add handlers
                Array.from(container.querySelectorAll('.btn-copy-ip, .btn-copy-ip-2')).forEach(b=>{
                    b.addEventListener('click', ()=>{
                        const ip = b.closest('.card-right').querySelector('.server-ip').textContent.trim();
                        navigator.clipboard?.writeText(ip).then(()=>{ const orig=b.textContent; b.textContent='Copiado!'; setTimeout(()=>b.textContent=orig,1400); }).catch(()=>alert('No se pudo copiar: '+ip));
                    });
                });
            }

            // initial load and polling
            loadServers();
            document.getElementById('servers-refresh').addEventListener('click', ()=> loadServers());
            setInterval(loadServers, 5000);
            }catch(err){ console.error('Error rendering servers list', err); document.getElementById('servers-list').innerHTML = '<p class="muted">Error al cargar servidores. Revisa la consola.</p>'; }
        })();

        function escapeHtml(str){ return (str+'').replace(/[&<>\"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

        // Diagnóstico: comprobar si CSS cargó
        (function(){
            const found = Array.from(document.styleSheets).some(s => s.href && s.href.includes('menu_principal.css'));
            if(!found) console.warn('Aviso: menu_principal.css no parece cargado en servers.html');
        })();

        // fixed back button handler (global) - attach after DOM ready
        document.addEventListener('DOMContentLoaded', ()=>{
            const btn = document.getElementById('back-menu-fixed');
            if(btn) btn.addEventListener('click', ()=> location.href='menu_principal.html');
        });
    </script>
    <button id="back-menu-fixed" class="btn-main alt">Volver al menú principal</button>
</body>
</html>
