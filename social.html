<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redes - ARGPROYECTS</title>
    <link rel="stylesheet" href="./menu_principal.css">
</head>
<body>
    <div id="menu-background">
        <header class="servers-hero">
            <div class="hero-left">
                <h1 class="title-glow">Redes Sociales</h1>
                <h2 class="subtitle">Conéctate con nuestra comunidad</h2>
                <p class="hero-lead">Información y accesos directos. Puedes expandir o minimizar las tarjetas; los administradores pueden editar cada entrada.</p>
            </div>
            <div class="admin-controls" id="social-admin-controls" style="display:none">
                <button id="back-home" class="btn-main alt">Volver</button>
            </div>
        </header>

        <main class="servers-area">
            <div class="social-controls" style="width:100%;max-width:1100px;padding:12px 18px;box-sizing:border-box;display:flex;justify-content:space-between;gap:8px;align-items:center;">
                <div></div>
                <div></div>
            </div>

            <ul id="social-list" class="social-list" style="width:100%;max-width:1100px;padding:12px 18px;box-sizing:border-box;list-style:none;margin:0;">
                <!-- items rendered here -->
            </ul>
        </main>

        <footer id="signature">Hecho por Alvaro Restrepo</footer>
    </div>

    <!-- fixed back button bottom-left -->
    <button id="back-menu-fixed" class="btn-main alt">Volver al menú principal</button>

    <script src="./auth.js"></script>
    <script src="./firebase-client.js"></script>
    <script>
        const mapNames = { youtube: 'YouTube', kick: 'Kick', tiktok: 'TikTok' };

        (function(){
            const API_BASE = 'http://localhost:3000';
            const platforms = ['youtube','kick','tiktok'];
            const listEl = document.getElementById('social-list');

            async function fetchSocialsFromApi(){
                try{
                    if(window.StaticDB && StaticDB.getSocials) {
                        const s = await StaticDB.getSocials(); if(s) return s;
                    }
                }catch(e){ console.warn('StaticDB getSocials failed', e); }

                // Only try local API when running on localhost to avoid ERR_CONNECTION_REFUSED
                const host = window.location.hostname;
                if(host !== 'localhost' && host !== '127.0.0.1'){
                    return null;
                }

                try{
                    const r = await fetch(API_BASE + '/socials'); if(!r.ok) throw new Error('bad');
                    const data = await r.json(); if(data){ if(window.apAuth && apAuth.saveSocials) apAuth.saveSocials(data); return data; }
                }catch(e){ console.warn('fetch socials failed', e); }
                return null;
            }

            async function loadAndRender(){
                const remote = await fetchSocialsFromApi();
                const socials = remote || apAuth.getSocials() || {};
                renderAllFromData(socials);
            }

            function createItem(site, data){
                data = data || apAuth.getSocial(site) || {};
                const li = document.createElement('li'); li.className = 'social-item expanded';
                li.dataset.site = site;
                li.innerHTML = `
                    <div class="social-header">
                        <div>
                            <div class="social-title">${mapNames[site] || site}</div>
                            <div class="social-tagline">${data.tagline||''}</div>
                        </div>
                        <div class="social-actions">
                                <a class="btn-main social-open" href="${data.link||'#'}" target="_blank">Quiero darle una vueltica</a>
                            </div>
                    </div>
                    <div class="social-content"> <p class="muted">${data.desc||'No hay descripción configurada.'}</p> </div>
                `;

                const openLink = li.querySelector('.social-open');

                // if no link, disable openLink
                if(!data.link){ openLink.href='#'; openLink.removeAttribute('target'); openLink.textContent='Canal no configurado'; openLink.classList.add('btn-main','alt'); }

                return li;
            }

            function renderAllFromData(socials){
                listEl.innerHTML = '';
                platforms.forEach(p=> listEl.appendChild(createItem(p, socials[p]||{})));
            }

            document.addEventListener('DOMContentLoaded', ()=>{
                const bHome = document.getElementById('back-home'); if(bHome) bHome.addEventListener('click', ()=> location.href='menu_principal.html');
                const backMenuFixed = document.getElementById('back-menu-fixed'); if(backMenuFixed) backMenuFixed.addEventListener('click', ()=> location.href='menu_principal.html');
            });

            // initial render + polling
            loadAndRender();
            setInterval(loadAndRender, 5000);
        })();
    </script>
</body>
</html>
