<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redes - ARGPROYECTS</title>
    <link rel="stylesheet" href="./menu_principal.css">
</head>
<body>
    <div id="menu-background">
        <header class="servers-hero">
            <div class="hero-left">
                <h1 class="title-glow">Redes Sociales</h1>
                <h2 class="subtitle">Conéctate con nuestra comunidad</h2>
                <p class="hero-lead">Información y accesos directos. Puedes expandir o minimizar las tarjetas; los administradores pueden editar cada entrada.</p>
            </div>
            <div class="admin-controls" id="social-admin-controls" style="display:none">
                <button id="back-home" class="btn-main alt">Volver</button>
            </div>
        </header>

        <main class="servers-area">
            <div class="social-controls" style="width:100%;max-width:1100px;padding:12px 18px;box-sizing:border-box;display:flex;justify-content:space-between;gap:8px;align-items:center;">
                <div></div>
                <div></div>
            </div>

            <ul id="social-list" class="social-list" style="width:100%;max-width:1100px;padding:12px 18px;box-sizing:border-box;list-style:none;margin:0;">
                <!-- items rendered here -->
            </ul>
        </main>

        <footer id="signature">Hecho por Alvaro Restrepo</footer>
    </div>

    <!-- fixed back button bottom-left -->
    <button id="back-menu-fixed" class="btn-main alt">Volver al menú principal</button>

    <script src="./auth.js"></script>
    <script>
        const mapNames = { youtube: 'YouTube', kick: 'Kick', tiktok: 'TikTok' };

        (function(){
            const platforms = ['youtube','kick','tiktok'];
            const listEl = document.getElementById('social-list');

            function createItem(site){
                const data = apAuth.getSocial(site) || {};
                const li = document.createElement('li'); li.className = 'social-item expanded';
                li.dataset.site = site;
                li.innerHTML = `
                    <div class="social-header">
                        <div>
                            <div class="social-title">${mapNames[site] || site}</div>
                            <div class="social-tagline">${data.tagline||''}</div>
                        </div>
                        <div class="social-actions">
                                <a class="btn-main social-open" href="${data.link||'#'}" target="_blank">Ir al canal</a>
                                <button class="btn-main alt social-edit" style="display:none;">Editar</button>
                            </div>
                    </div>
                    <div class="social-content"> <p class="muted">${data.desc||'No hay descripción configurada.'}</p> </div>
                `;

                // attach handlers
                const editBtn = li.querySelector('.social-edit');
                const openLink = li.querySelector('.social-open');

                // admin edit visibility
                const cur = apAuth.getCurrent();
                if(cur && cur.role==='admin'){
                    editBtn.style.display = 'inline-block';
                    editBtn.addEventListener('click', ()=> openEditModal(site, li));
                }

                // if no link, disable openLink
                if(!data.link){ openLink.href='#'; openLink.removeAttribute('target'); openLink.textContent='Canal no configurado'; openLink.classList.add('btn-main','alt'); }

                return li;
            }

            function renderAll(){
                listEl.innerHTML = '';
                platforms.forEach(p=> listEl.appendChild(createItem(p)));
            }

            function openEditModal(site, li){
                let modal = document.getElementById('social-edit-modal'); if(modal) modal.remove();
                const cur = apAuth.getSocial(site) || {};
                modal = document.createElement('div'); modal.id='social-edit-modal'; modal.className='edit-modal';
                modal.innerHTML = `\n                <div class="modal-card">\n                    <h3>Editar ${mapNames[site] || site}</h3>\n                    <input id="s-title" placeholder="Título corto (ej: Canal Oficial)" value="${(cur.tagline||'').replace(/"/g,'&quot;')}">\n                    <input id="s-link" placeholder="URL del canal (https://...)" value="${(cur.link||'').replace(/"/g,'&quot;')}">\n                    <textarea id="s-desc" placeholder="Descripción">${(cur.desc||'').replace(/"/g,'&quot;')}</textarea>\n                    <div class="modal-actions">\n                        <button id="s-save" class="btn-main">Guardar</button>\n                        <button id="s-cancel" class="btn-main alt">Cancelar</button>\n                    </div>\n                </div>`;
                document.body.appendChild(modal);
                document.getElementById('s-cancel').addEventListener('click', ()=> modal.remove());
                document.getElementById('s-save').addEventListener('click', ()=>{
                    const data = { tagline: document.getElementById('s-title').value.trim(), link: document.getElementById('s-link').value.trim(), desc: document.getElementById('s-desc').value.trim() };
                    if(!data.link){ if(!confirm('La URL está vacía. Guardar de todos modos?')) return; }
                    apAuth.setSocial(site, data);
                    modal.remove();
                    renderAll();
                });
            }

            document.addEventListener('DOMContentLoaded', ()=>{
                const bHome = document.getElementById('back-home'); if(bHome) bHome.addEventListener('click', ()=> location.href='menu_principal.html');
                const backMenuFixed = document.getElementById('back-menu-fixed'); if(backMenuFixed) backMenuFixed.addEventListener('click', ()=> location.href='menu_principal.html');
            });

            // initial render
            renderAll();
        })();
    </script>
</body>
</html>
